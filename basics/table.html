<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>

        .container{
            overflow-x: auto;
        }

        table{
            text-align: center;
            border:10px solid gray;
            border-radius: 25%;
            background-color: aliceblue;
            border-style: dotted;
            min-width: 600px;
        }

        th,td{
            border: 2px solid black;
            border-radius: 50%;
            background-color:lightblue;
        }


        </style>
</head>
<body>
    
    <div class="container">

        <table cellspacing="20" cellpadding="20">
            <tr>
                <th>Firstname</th>
                <th>Lastname</th>
                <th>Age</th>
            </tr>
            
            <tr>
                <td>Jill</td>
                <td>Smith</td>
                <td>20</td>
            </tr>
            
            <tr>
                <td>Eve</td>
                <td>Jackson</td>
                <td>94</td>
            </tr>
        </table>
    </div>
        
</body>
</html>
