<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tags</title>


    <style>
        table, th, tr{
            border: 2px solid red;
            border-style: dotted;
           
        }

        td{
            border: 2px solid green;
            border-radius: 23px;
            background-color:aquamarine;
        }

        .red{
            padding: 34px;
        }

        table{
             border-top: 20px solid gray;
             width: 500px;
             height: 200px;
             background-color:aqua;
             border-color: chartreuse;
             border-style: double;
        }
    </style>


</head>
<body>
    
    <table>
        <thead>

            <tr >
                <th>First name</th>
                <th>Last name</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jill</td>
                <td>Smith</td>
                <td>50</td>
            </tr>

            <tr>
                <td>Eve</td>
                <td>Jackson</td>
                <td>94</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Copyright</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
